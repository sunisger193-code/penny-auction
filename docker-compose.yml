version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://aurum_user:aurum_secure_pass@db:5432/aurum_auction?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=aurum_production_super_secret_jwt_2026
      - ADMIN_SECURITY_TOKEN=AURUM-ADMIN-8888-MASTER
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: aurum_user
      POSTGRES_PASSWORD: aurum_secure_pass
      POSTGRES_DB: aurum_auction
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
